# Plain-language texts of the checks (SPEC §3 item 4, §7). Owner: E, written in her own words (slice S16a).
#
# Key names are not agreed with D yet: one entry per check id (as in CheckResult.check_id), with `name` and `rule`.
# Thresholds written here (4 of 5, 40%, 20%, 5 times, 10%, 90%) must equal app/settings.yaml:
# tests/unit/test_texts.py fails and names the text to update when a setting changes.
# Information, not advice: never "buy", "sell" or "undervalued".

P1:
  name: "Consistently profitable"
  rule: "The company made a profit in at least 4 of the last 5 years."
P2:
  name: "Growing profit"
  rule: "The profit of the latest year is positive and higher than the profit 4 years earlier."
P3:
  name: "Profit growth is speeding up"
  rule: "Profit grew faster in the latest year than its average yearly growth over the last 4 years."
P4:
  name: "Return on equity above its industry"
  rule: "Profit divided by the money invested by shareholders (return on equity) is higher than the average of companies in the same industry."
P5:
  name: "Margin above its industry"
  rule: "The share of each dollar of sales left after operating costs (operating margin) is higher than the average of companies in the same industry."
P6:
  name: "Return on capital improved"
  rule: "Operating profit made on the money invested in the business (return on capital employed) is higher than 3 years ago."

H1:
  name: "Short-term debts covered"
  rule: "What the company owns that turns into cash within a year (cash, inventory, money owed by customers) covers what it must pay within a year."
H2:
  name: "Long-term debts covered"
  rule: "What the company owns that turns into cash within a year also covers what it must pay after more than a year."
H3:
  name: "Moderate debt"
  rule: "Debt minus cash (net debt) is less than 40% of the money invested by shareholders (equity)."
H4:
  name: "Debt is falling"
  rule: "Debt compared with equity is lower than 4 years earlier."
H5:
  name: "Debt covered by cash flow"
  rule: "The cash generated by the business in the latest year would pay off at least 20% of the company's debt."
H6:
  name: "Interest well covered"
  rule: "Operating profit is at least 5 times the interest paid on the debt."

D1:
  name: "Pays a dividend"
  rule: "The company paid a dividend to its shareholders in the latest year."
D2:
  name: "Dividend yield above the US market"
  rule: "The dividend, as a percentage of the share price, is higher than the US market average."
D3:
  name: "Stable dividend"
  rule: "The dividend never dropped by more than 10% from one year to the next over the last 5 years."
D4:
  name: "Dividend grew"
  rule: "The dividend paid in the latest year is higher than 4 years earlier."
D5:
  name: "Dividend covered by profit"
  rule: "The dividend is less than 90% of the profit, so the profit is enough to pay it."
D6:
  name: "Dividend covered by cash"
  rule: "The dividend is no more than the cash generated by the business minus the money spent on buildings and equipment (capital expenditure)."
