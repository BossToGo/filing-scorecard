# Plain-language texts of the checks (SPEC §3 item 4, §7). Owner: E, written in her own words (slice S16a).
#
# Key names are not agreed with D yet: one entry per check id (as in CheckResult.check_id), with `name` and `rule`.
# Thresholds written here (4 of 5, 40%, 20%, 5 times, 10%, 90%) must equal app/settings.yaml:
# tests/unit/test_texts.py fails and names the text to update when a setting changes.
# Information, not advice: never "buy", "sell" or "undervalued".

P1:
  name: "Consistently profitable"
  rule: "The company made a profit in at least 4 of the last 5 years."
P2:
  name: "Growing profit"
  rule: "The profit of the latest year is positive and higher than the profit 4 years earlier."
P3:
  name: "Profit growth is speeding up"
  rule: "Profit grew faster in the latest year than its average yearly growth over the last 4 years."
P4:
  name: "Return on equity above its industry"
  rule: "Profit divided by equity (what the company owns minus what it owes, the part that belongs to its shareholders), called return on equity, is higher than the average of companies in the same industry."
P5:
  name: "Margin above its industry"
  rule: "The share of each dollar of sales left after operating costs (operating margin) is higher than the average of companies in the same industry."
P6:
  name: "Return on capital improved"
  rule: "Operating profit made on the money invested in the business (return on capital employed) is higher than 3 years ago."

H1:
  name: "Short-term liabilities covered"
  rule: "What the company owns that turns into cash within a year (cash, inventory, money owed by customers) covers what it must pay within a year."
H2:
  name: "Long-term liabilities covered"
  rule: "What the company owns that turns into cash within a year covers what it must pay after more than a year."
H3:
  name: "Moderate debt"
  rule: "Debt minus cash (net debt) is less than 40% of equity (what the company owns minus what it owes, the part that belongs to its shareholders)."
H4:
  name: "Debt falling against equity"
  rule: "Debt (money borrowed) compared with equity is lower than 4 years earlier."
H5:
  name: "Debt covered by cash flow"
  rule: "The cash generated by the business in the latest year would pay off at least 20% of the company's debt."
H6:
  name: "Interest well covered"
  rule: "Operating profit is at least 5 times the interest paid on the debt."

D1:
  name: "Pays a dividend"
  rule: "The company paid a dividend to its shareholders in the latest year."
D2:
  name: "Dividend yield above the US market"
  rule: "The dividend, as a percentage of the share price, is higher than the US market average."
D3:
  name: "No large dividend cut"
  rule: "Total dividends paid never dropped by more than 10% from one year to the next over the last 5 years."
D4:
  name: "Dividend grew"
  rule: "Total dividends paid in the latest year are higher than 4 years earlier."
D5:
  name: "Dividend covered by profit"
  rule: "Total dividends paid are less than 90% of the profit, so the profit is enough to pay them. The check fails if the company makes no profit or a loss."
D6:
  name: "Dividend covered by cash"
  rule: "Total dividends paid are no more than the cash generated by the business minus the money spent on buildings and equipment (capital expenditure)."

V1:
  name: "Price below the cash-flow estimate"
  rule: "The share price you typed is lower than the estimate of what one share is worth, calculated from the cash the company is expected to generate."
V2:
  name: "Price at or below 80% of the estimate"
  rule: "The share price you typed is at or below 80% of the estimate."
V3:
  name: "Price to earnings below industry"
  rule: "The value of all its shares at the price you typed, divided by its latest yearly profit (price to earnings), is lower than the average of companies in the same industry. A loss or zero profit fails the check."
V4:
  name: "Price to earnings below the US market"
  rule: "The value of all its shares at the price you typed, divided by its latest yearly profit (price to earnings), is lower than the average of the whole US stock market, excluding financial companies. A loss or zero profit fails the check."
V5:
  name: "Price to book below industry"
  rule: "The value of all its shares at the price you typed, divided by its equity (what the company owns minus what it owes, the part that belongs to its shareholders) at the latest year end (price to book), is lower than the average of companies in the same industry. Zero or negative equity fails the check."
V6:
  name: "Price does not demand heroic growth"
  rule: "The share price you typed is at or below the estimate recalculated as if the company's growth started at 30% a year, the highest the model allows."

# Shown under "Industry: [group] (Damodaran lookup)" and on the sources page (SPEC §9.1; key agreed with D on #56)
industry_note: "Each company in Professor Damodaran's (NYU) list is classified into an industry group, and the industry average shown is his published figure for that group."

# Plain names of company figures in the check tables, by line item (key and format agreed with Simon on #65;
# shown once D's figure_name() reads this section)
figures:
  capital_expenditure: "Capital expenditure (spending on buildings and equipment)"
  operating_cash_flow: "Operating cash flow"
  operating_income: "Operating income"
  current_assets: "Short-term assets (current assets)"
  current_liabilities: "Short-term liabilities (current liabilities)"
  total_liabilities: "Total liabilities"
  equity: "Equity (shareholders' part)"
  interest_expense: "Interest expense"
  dividends_paid: "Total dividends paid"
  shares: "Shares outstanding"
