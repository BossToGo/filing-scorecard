# Line items → XBRL tags (SPEC §6). Owner: A. Read by src/data/resolver.py; no tag names live in code.
#
# For every fiscal year, the tags of a line item are tried in order and the first one with an annual 10-K value is
# used (Apple's `Revenues` stops in 2018, so a per-company choice would lose years). If a later tag in the list has
# a different value for the same period, the figure is flagged (SPEC §5.3.7).
# kind: flow = covers a fiscal year (350 to 380 days); instant = a balance at the fiscal year end date.
# Change a list only with a reason (a real file looked at, or docs/coverage.md), written next to it.

line_items:
  revenue:
    kind: flow
    tags: [Revenues, RevenueFromContractWithCustomerExcludingAssessedTax, SalesRevenueNet]
  cost_of_revenue:
    kind: flow
    tags: [CostOfRevenue, CostOfGoodsAndServicesSold]
  gross_profit:
    kind: flow
    tags: [GrossProfit]  # else revenue − cost of revenue (derived)
  operating_income:
    kind: flow
    tags: [OperatingIncomeLoss]
  net_income:
    kind: flow
    tags: [NetIncomeLoss, ProfitLoss]
  interest_expense:
    kind: flow
    # Apple reports no interest expense tag after FY2023 (S0b): its interest expense is then missing, not guessed.
    tags: [InterestExpense, InterestExpenseNonoperating, InterestExpenseDebt]
  depreciation_amortization:
    kind: flow
    tags: [DepreciationDepletionAndAmortization, DepreciationAndAmortization, DepreciationAmortizationAndAccretionNet]
  total_assets:
    kind: instant
    tags: [Assets]
  current_assets:
    kind: instant
    tags: [AssetsCurrent]
  current_liabilities:
    kind: instant
    tags: [LiabilitiesCurrent]
  equity:
    kind: instant
    tags: [StockholdersEquity]
  total_equity:
    kind: instant
    tags: [StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]  # else equity + minority interest
  total_liabilities:
    kind: instant
    tags: [Liabilities]  # else total assets − total equity (derived); KO, MCD and AMZN have no `Liabilities`
  cash:
    kind: instant
    tags: [CashAndCashEquivalentsAtCarryingValue]
  receivables:
    kind: instant
    tags: [AccountsReceivableNetCurrent]
  inventory:
    kind: instant
    tags: [InventoryNet]
  payables:
    kind: instant
    tags: [AccountsPayableCurrent]
  ppe_net:
    kind: instant
    tags: [PropertyPlantAndEquipmentNet]
  operating_cash_flow:
    kind: flow
    tags: [NetCashProvidedByUsedInOperatingActivities]
  capital_expenditure:
    kind: flow
    outflow: true  # filed as a positive payment; a negative value is flagged (SPEC §5.4, sign error)
    # Nvidia (from 2012) and Amazon (from 2016) file capital expenditure as PaymentsToAcquireProductiveAssets (S0b).
    tags: [PaymentsToAcquirePropertyPlantAndEquipment, PaymentsToAcquireProductiveAssets]
  dividends_paid:
    kind: flow
    outflow: true
    tags: [PaymentsOfDividends, PaymentsOfDividendsCommonStock]
  minority_interest:
    kind: instant
    bridge: true  # absent: "not reported, treated as nil" (SPEC §8.3)
    tags: [MinorityInterest]
  preferred_stock:
    kind: instant
    bridge: true
    tags: [PreferredStockValue]
  equity_method_investments:
    kind: instant
    bridge: true
    tags: [EquityMethodInvestments]

# Financial debt (SPEC §6), built by the resolver from these parts; operating leases are excluded.
# Coca-Cola's long-term debt tags changed in 2024 to the ...CapitalLeaseObligations names (identical values in
# 2023, S0b). McDonald's classifies its commercial paper and current maturities inside long-term debt (10-K filed
# 2026-02-24, Debt Financing note): when the total long-term debt equals the non-current part, nothing more is
# added, so nothing is counted twice (plan Q5).
debt:
  long_term_noncurrent: [LongTermDebtNoncurrent, LongTermDebtAndCapitalLeaseObligations]
  long_term_current: [LongTermDebtCurrent, LongTermDebtAndCapitalLeaseObligationsCurrent]
  long_term_total: [LongTermDebt, LongTermDebtAndCapitalLeaseObligationsIncludingCurrentMaturities]
  short_term_total: [ShortTermBorrowings]  # when present, commercial paper is assumed to be inside it
  short_term_parts: [CommercialPaper, OtherShortTermBorrowings]

# Company-specific tag order, only where a filing shows that the general order picks the wrong figure. Each entry
# cites the filing. A difference explained here is recorded in the figure's note but not raised as a warning.
overrides:
  MCD:
    depreciation_amortization:
      tags: [DepreciationAndAmortization, DepreciationDepletionAndAmortization]
      reason: >-
        McDonald's files its cash flow statement total (2,199 million in 2025) under DepreciationAndAmortization and
        only the part inside SG&A (457 million) under DepreciationDepletionAndAmortization; 10-K filed 2026-02-24,
        accession 0000063908-26-000035

# Shares (SPEC §6): the cover-page count of the latest annual report, else the diluted weighted average of the
# latest fiscal year (derived, with a warning).
shares:
  cover_tag: EntityCommonStockSharesOutstanding  # dei taxonomy
  average_tag: WeightedAverageNumberOfDilutedSharesOutstanding
