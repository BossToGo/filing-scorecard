# Synthetic Co. — SYNTHETIC DATA. An invented company for tests: SPEC.md Appendix A, copied cell by cell.
#
# Collected by A (slice S0c). tests/unit/test_synthetic_fixture.py checks every number below against the tables
# in SPEC.md Appendix A, so a copying mistake fails a test.
#
# Rule 14.5: an expected value may be used in a test only after its owner has recalculated it by hand or in
# Excel and signed off. How (SPEC slice S0c, five sign-offs in the pull request): the owner posts a review comment
# on the S0c pull request with the rows, the date, the method and any difference; A then records it under
# `sign_off` below with a link to that comment. Until then, the expected_...() functions in synthetic.py refuse to
# return those values. If a recalculation disagrees, do not edit the value here: tell the group, correct SPEC.md
# Appendix A (or docs/acceptance.md) by pull request, then this file.
#
# Units: amounts in USD millions as in Appendix A (the loader converts them to USD for `Fact`s); shares in
# millions; rates as decimals. Fiscal years end on 31 December (Appendix A gives fiscal years only).

