# Synthetic Co. — SYNTHETIC DATA. An invented company for tests: SPEC.md Appendix A (version 2.3), copied cell
# by cell.
#
# Collected by A (slice S0c). tests/unit/test_synthetic_fixture.py checks every number below against the tables
# in SPEC.md Appendix A, so a copying mistake fails a test.
#
# Rule 14.5: an expected value may be used in a test only after its owner has recalculated it by hand or in
# Excel and signed off. How (SPEC slice S0c, five sign-offs in the pull request): the owner posts a review comment
# on the S0c pull request with the rows, the date, the method and any difference; A then records it under
# `sign_off` below with a link to that comment. Until then, the expected_...() functions in synthetic.py refuse to
# return those values. If a recalculation disagrees, do not edit the value here: tell the group, correct SPEC.md
# Appendix A (or docs/acceptance.md) by pull request, then this file.
#
# Units: amounts in USD millions as in Appendix A (the loader converts them to USD for `Fact`s); shares in
# millions; rates as decimals. Fiscal years end on 31 December (Appendix A gives fiscal years only).

label: SYNTHETIC DATA
source: SPEC.md Appendix A, version 2.3 (equity method)
fiscal_years: [2021, 2022, 2023, 2024, 2025]

line_items:  # USD millions, FY2021 to FY2025
  revenue: [1000, 1080, 1150, 1210, 1300]
  operating_income: [150, 170, 160, 190, 208]
  interest_expense: [20, 20, 22, 24, 26]
  net_income: [100, 115, 105, 128, 140]
  depreciation_amortization: [50, 54, 58, 60, 65]
  capital_expenditure: [60, 70, 75, 80, 85]
  operating_cash_flow: [160, 175, 150, 195, 215]
  dividends_paid: [40, 44, 48, 45, 56]
  total_assets: [1400, 1480, 1560, 1640, 1750]
  current_assets: [420, 450, 470, 500, 540]
  current_liabilities: [300, 310, 330, 340, 360]
  cash: [80, 90, 85, 100, 120]
  financial_debt: [400, 410, 430, 440, 450]
  equity: [600, 650, 690, 750, 820]
  total_liabilities: [800, 830, 870, 890, 930]

other_inputs:
  current_financial_debt_fy2025: 50   # USD millions; not used since version 2.3
  shares_millions: 100
  share_price_usd: 30.00
  minority_interest: 0                 # "no non-controlling interests, preferred shares or equity-method investments"
  preferred_stock: 0
  equity_method_investments: 0

settings:
  risk_free_rate: 0.040
  equity_risk_premium: 0.050
  tax_rate: 0.21                # for the beta only
  terminal_growth: 0.025
  fcf_base_years: 3             # free cash flow margin over the last three fiscal years
  growth_floor: -0.10           # starting growth limited to −10% to +30%
  growth_cap: 0.30
  growth_half_life_years: 2     # the gap to terminal growth halves every 2 years
  forecast_years: 10
  beta_min: 0.8                 # neither limit applies to this company
  beta_max: 2.0

benchmarks:  # synthetic
  unlevered_beta: 0.90
  return_on_equity: 0.15
  operating_margin: 0.18
  price_to_earnings: 20.0          # industry
  market_price_to_earnings: 24.0   # whole US market (V4)
  price_to_book: 4.0
  market_dividend_yield: 0.015

# Expected results, as shown in Appendix A. `value` and `compared_with` are in the unit shown there
# ("%" means percent: 9.375 is 9.375%). Tolerance: half a unit of the last decimal shown (`decimals`).
# A test of a check asserts its value and what it is compared with, not only pass or fail: several wrong formulas
# give the same pass or fail on this company (audit of 21 November 2026).
expected_checks:
  P1: {owner: B, result: pass, value: 5, compared_with: 4, unit: years, decimals: 0}  # the limit is 4 ("at least 4 of 5"): corrected from 5 at owner B's sign-off on #5, 24 November 2026; Appendix A shows it
  P2: {owner: B, result: pass, value: 140, compared_with: 100, unit: USD m, decimals: 0}
  P3: {owner: B, result: pass, value: 9.375, compared_with: 8.776, unit: "%", decimals: 3}
  P4: {owner: B, result: pass, value: 17.83, compared_with: 15, unit: "%", decimals: 2}
  P5: {owner: B, result: fail, value: 16.00, compared_with: 18, unit: "%", decimals: 2}
  P6: {owner: B, result: pass, value: 14.96, compared_with: 14.53, unit: "%", decimals: 2}
  H1: {owner: B, result: pass, value: 540, compared_with: 360, unit: USD m, decimals: 0}
  H2: {owner: B, result: fail, value: 540, compared_with: 570, unit: USD m, decimals: 0}
  H3: {owner: B, result: fail, value: 40.24, unit: "%", decimals: 2}
  H4: {owner: B, result: pass, value: 54.88, compared_with: 66.67, unit: "%", decimals: 2}
  H5: {owner: B, result: pass, value: 47.78, unit: "%", decimals: 2}
  H6: {owner: B, result: pass, value: 8.0, unit: x, decimals: 1}
  D1: {owner: C, result: pass, value: 56, unit: USD m, decimals: 0}
  D2: {owner: C, result: pass, value: 1.867, compared_with: 1.5, unit: "%", decimals: 3}
  D3: {owner: C, result: pass, value: -6.25, unit: "%", decimals: 2}
  D4: {owner: C, result: pass, value: 56, compared_with: 40, unit: USD m, decimals: 0}
  D5: {owner: C, result: pass, value: 40, unit: "%", decimals: 0}
  D6: {owner: C, result: pass, value: 56, compared_with: 130, unit: USD m, decimals: 0}
  V1: {owner: C, result: fail, value: 30.00, compared_with: 20.13, unit: USD, decimals: 2}  # price against fair value
  V2: {owner: C, result: fail, value: 30.00, compared_with: 16.10, unit: USD, decimals: 2}  # against 80% of it
  V3: {owner: C, result: fail, value: 21.43, compared_with: 20.0, unit: x, decimals: 2}     # P/E against the industry
  V4: {owner: C, result: pass, value: 21.43, compared_with: 24.0, unit: x, decimals: 2}     # P/E against the US market
  V5: {owner: C, result: pass, value: 3.66, compared_with: 4.0, unit: x, decimals: 2}
  V6: {owner: C, result: pass, value: 30.00, compared_with: 37.37, unit: USD, decimals: 2}  # fair value at the 30% cap

expected_scores:  # passes out of 6, tier 2 (benchmarks and share price present); owner E
  past_performance: 5
  financial_health: 4
  dividend: 6
  valuation: 3

