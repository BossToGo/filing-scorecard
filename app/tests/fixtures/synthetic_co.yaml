  levered_beta: {value: 1.00665, unit: x, decimals: 5}
  cost_of_equity: {value: 9.03325, unit: "%", decimals: 5}
  base_free_cash_flows: {values: [75, 115, 130], unit: USD m, decimals: 0}  # FY2023 to FY2025
