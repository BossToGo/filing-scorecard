# Strengths and points to watch (SPEC section 9 and Appendix A); owner B. `value` as shown in Appendix A.
expected_statements:
  G1: {shown: true}
  G2: {shown: true, value: 8.78, unit: "%", decimals: 2}   # net income growth a year over four years
  G3: {shown: true}
  G4: {shown: false}
  G5: {shown: true}
  G6: {shown: true}
  G7: {shown: false}
  W1: {shown: false}
  W2: {shown: false}
  W3: {shown: true}
  W4: {shown: true}
  W5: {shown: false}
  W6: {shown: false}
  W7: {shown: false}
  W8: {shown: true, value: 49.0, unit: "%", decimals: 1}   # share price above the estimate
  overview: {strengths: [G1, G2, G3, G5, G6], points_to_watch: [W3, W4, W8]}

# Not in Appendix A: docs/acceptance.md AC3 (tier 1 build: no benchmarks, no share price); owner D.
