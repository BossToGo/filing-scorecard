# Thresholds and assumptions (SPEC §7, §8, §10). The values are the team's starting choices from SPEC.md.
#
# One section per owner (SPEC risk R10): change only your own section; for another section, ask its owner.
# Every setting has exactly a `value` and a one-line `reason` (checked by tests/unit/test_settings.py).
# Rates are decimals: 40% is written 0.40 (SPEC §5.4, percent against decimal).

data:  # owner A (SPEC §4, §5.3)
  max_requests_per_second:
    value: 5
    reason: "SEC fair access allows 10 per second; we keep half that (SPEC §4)"
  retries:
    value: 3
    reason: "Three retries with a growing pause, then the input is marked missing (SPEC §4)"
  annual_forms:
    value: ["10-K", "10-K/A"]
    reason: "Only annual reports and their amendments (SPEC §5.3.1)"
  quarterly_forms:
    value: ["10-Q", "10-Q/A"]
    reason: "Read only for the latest figures (CompanyData.recent): the twelve months to the latest quarter and the latest balance sheet; fiscal years still come from the annual forms alone (slice S2c, issue #71 item 1)"
  ytd_length_tolerance_days:
    value: 14
    reason: "Last year's year to date must cover the same quarters as this year's: at most 14 days longer or shorter (Coca-Cola's nine months: 274 days in 2026, 268 in 2025, as its quarters end on Fridays; slice S2c)"
  flow_period_min_days:
    value: 350
    reason: "A strict 365-day filter would drop 53-week fiscal years (SPEC §5.3.1)"
  flow_period_max_days:
    value: 380
    reason: "Upper bound of an annual flow period, 53-week years included (SPEC §5.3.1)"
  restatement_warning:
    value: 0.01
    reason: "Show both values with a warning when a restatement differs by more than 1% (SPEC §5.3.4)"
  risk_free_average_years:
    value: 5
    reason: "The risk-free rate is the average of the last five years of daily FRED DGS10 values, as in the Simply Wall St model: steadier estimates (decided by Igor, 20 November; SPEC v2.3 §4, §8.1)"
  risk_free_fallback_period:
    value: [2021-11-24, 2026-11-20]
    reason: "First and last day with a value behind the saved valuation.risk_free_rate, shown next to it (SPEC §4); A refreshes both before each release"
  tag_conflict_warning:
    value: 0.01
    reason: "Flag a figure when two fallback tags differ by more than 1% for the same period (SPEC §5.3.7)"
  debt_check_warning:
    value: 0.01
    reason: "Flag debt when the reported total long-term debt differs from non-current plus current by more than 1% (plan Q5)"
  minority_untagged_warning:
    value: 0.01
    reason: "Record on the sources page when total equity exceeds equity by more than 1% and no minority interest is tagged (SPEC v2.3 §8.3)"
  cover_page_max_days:
    value: 200
    reason: "A cover-page share count is used only if dated within 200 days after the latest fiscal year end, i.e. from the latest annual report (Mastercard's last single total is from 2010; second-source audit)"
  min_plausible_shares:
    value: 100000
    reason: "A share count below 100,000 is a filing in the wrong scale (McDonald's files its averages in millions), so it is treated as missing"
  fiscal_years:
    value: 5
    reason: "FY0 to FY-4: five fiscal years give the four growth intervals of SPEC §7"
  coverage_companies:
    value: 100
    reason: "About 100 non-financial companies for the coverage report (SPEC §13.2, S3)"
  coverage_core_threshold:
    value: 0.90
    reason: "Go as planned only if each core line item resolves for at least 90% of the companies (SPEC §13.4)"
  coverage_secondary_threshold:
    value: 0.70
    reason: "Debt and interest expense must resolve for at least 70% (SPEC v2.3 §13.4; depreciation, in this group until version 2.3, is no longer used by any check)"
  universe_size:
    value: 30
    reason: "The verified universe: 30 companies whose tier 1 figures all resolve and pass the checks (SPEC §13.4)"
  universe_min_industries:
    value: 8
    reason: "At least 8 industries among the companies (SPEC §13.2, S3)"

benchmarks:  # owner B: fixed source selections, recorded per SPEC §7; changes require a cited re-extract
  unlevered_beta_column:
    value: "Unlevered beta"
    reason: "Cost of equity uses the ordinary industry unlevered beta, not the cash-corrected column (SPEC §4)"
  roe_column:
    value: "ROE (unadjusted)"
    reason: "P4 compares stated earnings and book equity without capitalising R&D"
  operating_margin_column:
    value: "Pre-tax Unadjusted Operating Margin"
    reason: "P5 uses stated operating income before tax, with stock compensation included"
  pe_column:
    value: "Current PE"
    reason: "V3 and V4 both use latest-fiscal-year earnings, never forward estimates (SPEC §7)"
  pb_column:
    value: "PBV"
    reason: "V5 compares market equity with stated book equity"
  dividend_yield_column:
    value: "Dividend Yield"
    reason: "D2 compares dividends to market equity, not dividend payout relative to earnings"
  market_pe_group:
    value: "Total Market (without financials)"
    reason: "V4 excludes financial companies, matching the app's universe (SPEC §7)"
  market_pe_source_row:
    value: 104
    reason: "pedata.xls, Industry Averages, January 2026, Current PE in cell D104 (SPEC §7)"
  market_dividend_yield_group:
    value: "Total Market"
    reason: "D2 uses US market dividend yield, including non-dividend payers"
  market_dividend_yield_source_row:
    value: 103
    reason: "divfund.xls, Industry Averages, January 2026, Dividend Yield in cell F103"

past_performance:  # owner B (SPEC §7)
  p1_min_profitable_years:
    value: 4
    reason: "Consistently profitable: net income above zero in at least 4 of the last 5 fiscal years (P1)"

financial_health:  # owner B (SPEC §7)
  max_net_debt_to_equity:
    value: 0.40
    reason: "Moderate debt: (debt minus cash) divided by equity below 40% (H3)"
  min_operating_cash_flow_to_debt:
    value: 0.20
    reason: "Debt covered by cash flow: operating cash flow at least 20% of debt (H5)"
  min_interest_cover:
    value: 5.0
    reason: "Interest covered: operating income at least 5 times interest expense (H6)"

dividend:  # owner C (SPEC §7)
  max_dividend_cut:
    value: 0.10
    reason: "No large cut: no year-on-year fall in dividends paid of more than 10% in five years (D3)"
  max_payout_ratio:
    value: 0.90
    reason: "Covered by earnings: dividends paid below 90% of net income (D5)"

valuation:  # owner C (SPEC §7, §8)
  risk_free_rate:
    value: 0.0393
    reason: "Fallback for demo mode, a missing FRED key or no network: the average of the 1,247 daily 10-year yields ('10 Yr') in the US Treasury's Daily Treasury Par Yield Curve Rates from 2021-11-24 to 2026-11-20 (3.92966%, rounded), computed 24 November 2026 by a separate script. Taken from the Treasury (public domain), not from FRED, because FRED's terms forbid storing FRED data (item (p)); the values are the same as FRED DGS10, day by day. Period in data.risk_free_fallback_period. Otherwise the app computes the average live from FRED (SPEC §4, §8.1). A refreshes it before each release"
  equity_risk_premium:
    value: 0.05
    reason: "Session 5 convention (SPEC §8.1)"
  tax_rate:
    value: 0.21
    reason: "US federal statutory rate, used only to re-lever the industry beta; state taxes ignored, stated as a limitation (SPEC §8.1)"
  forecast_years:
    value: 10
    reason: "Ten years give starting growth time to approach the long-run rate before the terminal value begins (SPEC v2.3 §8.2)"
  fcf_base_years:
    value: 3
    reason: "Three years smooth temporary working-capital and capital-expenditure swings while keeping the starting cash-flow margin reasonably current (SPEC v2.3 §8.2)"
  terminal_growth_cap:
    value: 0.025
    reason: "Terminal growth is the lower of the risk-free rate and 2.5% (SPEC §8.3)"
  well_below_fair_value:
    value: 0.80
    reason: "Price at or below 80% of the estimate: share price at most 80% of the cash-flow estimate (V2; the name of the setting is unchanged)"
  growth_floor:
    value: -0.10
    reason: "The floor limits how strongly an unusually steep historical decline drives the forecast, with the adjustment disclosed in the growth note (SPEC v2.3 §8.2, §8.3)"
  growth_cap:
    value: 0.3
    reason: "The cap limits the extrapolation of exceptional historical growth, including growth caused by a boom or acquisition (SPEC v2.3 §8.2)"
  growth_half_life_years:
    value: 2
    reason: "Halving the gap to terminal growth every two years lets recent growth influence the early forecast and reduces its influence over time (SPEC v2.3 §8.2)"
  beta_min:
    value: 0.8
    reason: "The 0.8 floor keeps a low beta from pushing the company's cost of equity below the risk-free rate plus 4 percentage points (SPEC v2.3 §8.1)"
  beta_max:
    value: 2.0
    reason: "The ceiling limits the effect of an unusually high re-levered beta on the discount rate (SPEC v2.3 §8.1)"

gates:  # owner D (SPEC §10)
  unsupported_sic_min:
    value: 6000
    reason: "Banks, insurers and real estate trusts (SEC codes 6000 to 6799) are not supported (SPEC §2)"
  unsupported_sic_max:
    value: 6799
    reason: "Upper end of the unsupported SEC industry codes (SPEC §2)"
  min_fiscal_years:
    value: 3
    reason: "Fewer than three fiscal years: no report (SPEC §10)"
  balance_sheet_tolerance:
    value: 0.01
    reason: "Warn when total assets differ from liabilities plus equity by more than 1% (SPEC §10)"
  stale_report_months:
    value: 15
    reason: "Warn when the latest annual report is older than 15 months (SPEC §10)"
  min_firms_in_industry:
    value: 10
    reason: "Warn when the industry group has fewer than 10 firms (SPEC §10)"

highlights: {}  # owner B: thresholds of the 15 strengths and points to watch (G1-G7, W1-W8), set in slice S12 (SPEC v2.3 §9)
